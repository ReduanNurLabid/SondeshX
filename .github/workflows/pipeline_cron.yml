name: Dorpon Daily Autonomous Pipeline

on:
  schedule:
    # Hourly backup. The primary hourly trigger is cron-job.org -> workflow_dispatch,
    # which is punctual; GitHub's own scheduler can run hours late. A scheduled run
    # skips itself when another run already succeeded recently (see the guard step).
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of hourly stories to synthesize'
        required: false
        default: '6'

# Prevent two concurrent runs from overlapping and burning double quota.
concurrency:
  group: hourly-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Hard kill after 12 minutes — prevents a hung API call from
    # occupying a runner slot and blocking the next scheduled run.
    timeout-minutes: 18

    steps:
      - name: Skip Scheduled Run If One Succeeded Recently
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pipeline_cron.yml \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$last" ]; then
            age_min=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
            echo "Last successful run started ${age_min} minutes ago."
            if [ "$age_min" -lt 45 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout Repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly News Pipeline & Sync to Firestore
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PYTHONPATH: .
        run: |
          python -m pipeline.hourly_worker --limit ${{ github.event.inputs.limit || '6' }}

      - name: Commit Updated Output Data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/hourly_buzz_latest.json data/output/source_health.json || true
          git commit -m "chore(pipeline): auto-update hourly buzz [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or not needed"

      # Story pages, sitemaps and the RSS feed are static files built from Firestore,
      # so the site is rebuilt and redeployed after each run to include the new stories.
      # A failure here never affects the news pipeline above.
      - name: Install pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Rebuild Site With New Story Pages And Deploy
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15 deploy --only hosting:sondesh --project dorpon-a99a6 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # Facebook posts, 8 a day weighted to the evening peak (Bangladesh time), each a
      # different story: Reels at 09, 13, 19, 21; photo cards at 11, 17, 20, 22.
      # Fewer, stronger posts get wider distribution than many average ones.
      - name: Start Facebook Post For This Slot
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour=$(TZ=Asia/Dhaka date +%-H)
          if [[ " 9 13 19 21 " == *" $hour "* ]]; then
            gh workflow run facebook_reels.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f auto=true -f format=reel
            echo "Reel started for the ${hour}:00 slot."
          elif [[ " 11 17 20 22 " == *" $hour "* ]]; then
            gh workflow run facebook_reels.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f auto=true -f format=photo
            echo "Photo card started for the ${hour}:00 slot."
          else
            echo "No Reel slot at ${hour}:00 Bangladesh time."
          fi

      - name: Open Issue For Silent Sources
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          python -m pipeline.source_health > alert.md
          if [ -s alert.md ]; then
            open=$(gh issue list --state open --search "Source health alert in:title" --json number --jq 'length')
            if [ "$open" = "0" ]; then
              gh issue create --title "Source health alert: news sources gone silent" --body-file alert.md
            else
              echo "A source health issue is already open; not opening another."
            fi
          fi
