name: Facebook Reels

# Started only by the hourly news pipeline at the planned slots (Reels 09/13/19/21,
# photo cards 11/17/20/22 Bangladesh time) or by hand. GitHub's own timer is not used:
# it fired hours late and posted at 4-5 AM. Daily numbers run in facebook_insights.yml.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, do not post'
        type: boolean
        default: true
      story_id:
        description: 'Post this story instead of the top pick (optional)'
        required: false
        default: ''
      insights_only:
        description: 'Only refresh Reel performance numbers'
        type: boolean
        default: false
      auto:
        description: 'Started by the news pipeline (keeps posts spaced out)'
        type: boolean
        default: false
      format:
        description: 'reel (video) or photo (4:5 photo card)'
        type: choice
        options: [reel, photo]
        default: reel
      voice:
        description: 'Reel with Gemini voiceover (off = music only)'
        type: boolean
        default: true

concurrency:
  group: facebook-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright edge-tts
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-beng
          cd web && pnpm install --frozen-lockfile

      - name: Build And Serve The Reel Renderer
        if: (github.event.schedule != '10 23 * * *' && !inputs.insights_only)
        run: |
          cd web
          npx tsc --noEmit
          npx vite build
          nohup npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/__reel > /dev/null && break; sleep 1; done

      - name: Read Reel Performance From Facebook
        if: (github.event.schedule == '10 23 * * *' || inputs.insights_only)
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: .
        run: python -m pipeline.social.reel_insights

      - name: Render And Post Reel
        if: (github.event.schedule != '10 23 * * *' && !inputs.insights_only)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEL_TTS_VOICE: ${{ vars.REEL_TTS_VOICE || 'Kore' }}
          PYTHONPATH: .
        run: |
          ARGS="--base-url http://localhost:4173 --out reel.mp4 --format ${{ inputs.format || 'reel' }}"
          if [ -z "${{ inputs.story_id }}" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; }; then
            ARGS="$ARGS --min-gap-minutes 45"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.story_id }}" ]; then
            ARGS="$ARGS --story-id ${{ inputs.story_id }}"
          fi
          if [ "${{ inputs.voice }}" = "false" ]; then
            ARGS="$ARGS --no-voice"
          fi
          python -m pipeline.social.post_reel $ARGS

      - name: Keep The Rendered Video
        if: always() && (github.event.schedule != '10 23 * * *' && !inputs.insights_only)
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            reel.mp4
            reel.png
          if-no-files-found: ignore
          retention-days: 7
