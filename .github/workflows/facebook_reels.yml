name: Facebook Reels

on:
  schedule:
    # 08:30, 14:30 and 20:30 Bangladesh time (UTC+6)
    - cron: '30 2 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, do not post'
        type: boolean
        default: true
      story_id:
        description: 'Post this story instead of the top pick (optional)'
        required: false
        default: ''

concurrency:
  group: facebook-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright edge-tts
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-beng
          cd web && pnpm install --frozen-lockfile

      - name: Build And Serve The Reel Renderer
        run: |
          cd web
          npx tsc --noEmit
          npx vite build
          nohup npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/__reel > /dev/null && break; sleep 1; done

      - name: Render And Post Reel
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PYTHONPATH: .
        run: |
          ARGS="--base-url http://localhost:4173 --out reel.mp4"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.story_id }}" ]; then
            ARGS="$ARGS --story-id ${{ inputs.story_id }}"
          fi
          python -m pipeline.social.post_reel $ARGS

      - name: Keep The Rendered Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: reel.mp4
          if-no-files-found: ignore
          retention-days: 7
