name: Telegram Clip Inbox

# Reads new messages to the Sondesh Telegram bot: video clips from the editor, story
# choices and Post / Cancel buttons (pipeline/social/telegram_clips.py). It starts the
# heavy render and post runs of facebook_reels.yml itself.
# Primary trigger: cron-job.org -> workflow_dispatch every 5 minutes (punctual).
# GitHub's own timer below is only a backup; it can run late.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: telegram-poll
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start facebook_reels.yml runs

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Until The Bot Is Set Up
        id: ready
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN is not set yet."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout Repository
        if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.ready.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.ready.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Read The Telegram Inbox
        if: steps.ready.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python -m pipeline.social.telegram_clips
